[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="*.json"
exclude_filter="scripts/pony.gd, assets/pony_body.obj, assets/pony_head.obj, shaders/knit.gdshader, shaders/sunny_sky.gdshader, tests/*, assets/equestrian/*, assets/venue/kenney/*"
export_path="../public/game/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=false
html/custom_html_shell="res://web_shell.html"
html/export_icon=false
