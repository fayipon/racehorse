<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Sunny Cup 3D 賽場</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b4cbd0}canvas{display:block;width:100%;height:100%;outline:0}#status{position:absolute;inset:0;display:grid;place-items:center;font:14px system-ui;color:#fff;background:#304933}#status:empty{display:none}</style>$GODOT_HEAD_INCLUDE</head><body><canvas id="canvas" tabindex="-1"></canvas><div id="status">準備 3D 賽場…</div><script src="$GODOT_URL"></script><script>
window.raceState=null;
// The scene posts game-visible itself once its staged shader warm-up has drawn.
// Phones report 3x pixel ratios; rendering the stage at 1.5x looks the same and
// draws a quarter of the pixels. Desktops stop at 2x.
(function(){const cap=matchMedia('(pointer: coarse)').matches?1.5:2;const ratio=window.devicePixelRatio||1;if(ratio>cap){try{Object.defineProperty(window,'devicePixelRatio',{get:()=>cap,configurable:true});}catch(error){}}})();
// GitHub Pages crawls on some networks, so the page passes the commits that last
// changed the engine and the game pack, and they come from jsDelivr's copy of this
// site's own repo. The engine is kept gzipped there (jsDelivr refuses files over
// 20 MB). A mirror that fails or has not answered within 10 s falls back to Pages.
(function(){const site=location.hostname.match(/^([\w-]+)\.github\.io$/),repo=location.pathname.split('/')[1],query=new URLSearchParams(location.search);if(!site||!repo||typeof DecompressionStream==='undefined')return;const files=new Map([['index.wasm',['wasm','mirror/index.wasm.gz']],['index.pck',['pck','public/game/index.pck']]]);const direct=window.fetch.bind(window);window.fetch=function(input,init){const file=files.get(input),commit=file&&query.get(file[0]);if(!commit||!/^[0-9a-f]{40}$/.test(commit))return direct(input,init);const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),10000);return direct('https://cdn.jsdelivr.net/gh/'+site[1]+'/'+repo+'@'+commit+'/'+file[1],{signal:abort.signal}).then(response=>{clearTimeout(timer);if(!response.ok)throw new Error('mirror '+response.status);return file[1].endsWith('.gz')?new Response(response.body.pipeThrough(new DecompressionStream('gzip')),{headers:{'content-type':'application/wasm'}}):response;}).catch(()=>{clearTimeout(timer);return direct(input,init);});};})();
// The scene sets godotFrameInterval (ms) rather than Engine.max_fps, which spins
// the page's only thread until the next frame is due. Animation frames that
// arrive early are skipped without waking the engine.
(function(){const request=window.requestAnimationFrame.bind(window);let last=0;window.godotFrameInterval=0;window.requestAnimationFrame=function(callback){const tick=time=>{const interval=window.godotFrameInterval;if(interval>0&&last&&time-last<interval-4){request(tick);return;}last=time;callback(time);};return request(tick);};})();
// Each post bumps a version, so the scene only parses a state it has not seen.
window.raceStateVersion=0;
window.addEventListener('message',event=>{if(event.source===window.parent&&event.origin===window.location.origin&&event.data?.type==='race-state'){window.raceState=event.data;window.raceStateVersion++;}});
const config=$GODOT_CONFIG;
const engine=new Engine(config);
let gameLoaded=false;
engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{if(gameLoaded)return;window.parent.postMessage({type:'godot-progress',progress:total?Math.round(current/total*100):0},window.location.origin);document.getElementById('status').textContent=total?'準備賽場 '+Math.round(current/total*100)+'%':'準備 3D 賽場…';}}).then(()=>{gameLoaded=true;document.getElementById('status').textContent='';}).catch(error=>{document.getElementById('status').textContent='3D 賽場無法載入，請重新整理';console.error(error);window.parent.postMessage({type:'godot-error'},window.location.origin);});
</script></body></html>
