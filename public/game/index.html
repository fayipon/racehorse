<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Sunny Cup 3D 賽場</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b4cbd0}canvas{display:block;width:100%;height:100%;outline:0}#status{position:absolute;inset:0;display:grid;place-items:center;font:14px system-ui;color:#fff;background:#304933}#status:empty{display:none}</style></head><body><canvas id="canvas" tabindex="-1"></canvas><div id="status">準備 3D 賽場…</div><script src="index.js"></script><script>
window.raceState=null;
window.addEventListener('message',event=>{if(event.source===window.parent&&event.origin===window.location.origin&&event.data?.type==='race-state')window.raceState=event.data;});
const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9181000,"index.wasm":39514754},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4};
const engine=new Engine(config);
let gameLoaded=false;
engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{if(gameLoaded)return;window.parent.postMessage({type:'godot-progress',progress:total?Math.round(current/total*100):0},window.location.origin);document.getElementById('status').textContent=total?'準備賽場 '+Math.round(current/total*100)+'%':'準備 3D 賽場…';}}).then(()=>{gameLoaded=true;document.getElementById('status').textContent='';requestAnimationFrame(()=>requestAnimationFrame(()=>window.parent.postMessage({type:'game-visible'},window.location.origin)));}).catch(error=>{document.getElementById('status').textContent='3D 賽場無法載入，請重新整理';console.error(error);window.parent.postMessage({type:'godot-error'},window.location.origin);});
</script></body></html>
